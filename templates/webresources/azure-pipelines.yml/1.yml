
trigger:
- '*'

variables:
- group: DevEnv

pool:
  vmImage: 'windows-latest'

steps:
- checkout: self

- task: Npm@1
  inputs:
    command: 'install'

- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: 'npm install -g typescript; npm install -g jest; npm install -g webpack; npm install -g webpack-cli'
  displayName: 'Install NPM globals'

- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: 'npm install'
  displayName: 'Restore Dependencies'

# Typings (typings/XRM) are generated locally via Dataverse PowerTools: Generate Typings and
# committed to the repo, so CI does not regenerate them — it just builds against the committed
# typings. (The cross-platform net8 typings tool ships inside the VS Code extension, not here.)

- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: 'jest --coverage --coverageReporters=cobertura --reporters=jest-junit'
  displayName: 'Run Test Coverage'

- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: 'webpack --config webpack.prod.js'
  displayName: 'Build'

- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/junit.xml'

- task: PublishCodeCoverageResults@1
  inputs:
    codeCoverageTool: 'Cobertura'
    summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'

- task: PublishPipelineArtifact@1
  displayName: 'Publish solution packages to artifact'
  inputs:
    targetPath: '$(Build.SourcesDirectory)\bin'
    artifact: 'Release Build'
    publishLocation: 'pipeline'

