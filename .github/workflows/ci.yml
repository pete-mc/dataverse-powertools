name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build-test:
    name: Lint, build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Compile (webpack bundle)
        run: npm run compile
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests (headless VS Code)
        run: xvfb-run -a npm run test:integration

  ui-test:
    name: UI tests (ExTester)
    runs-on: ubuntu-latest
    # UI tests are slower and download a full VS Code + chromedriver; keep them
    # on their own job so they don't block the fast feedback from build-test.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Compile (webpack bundle)
        run: npm run compile
      - name: UI tests (headless)
        run: xvfb-run -a npm run test:ui
