on:
  push:
    branches:
      - main

name: Deploy Extension
env:
  # publish-vscode-extension still ships a node20 action.yml; GitHub force-runs it on
  # node24 via this flag (checkout/setup-node/setup-dotnet are already native node24).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
permissions:
  contents: read
jobs:
  version-check:
    # Every push to main runs this workflow, but the Marketplace rejects a duplicate
    # version — so only publish when package.json's version actually changed vs the
    # previous commit. A docs/CI-only push then skips deploy instead of failing on a
    # "version already exists" republish (which would leave main red).
    name: Version changed?
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: check
        shell: bash
        run: |
          new=$(jq -r .version package.json)
          old=$(git show HEAD~1:package.json 2>/dev/null | jq -r .version 2>/dev/null || echo "none")
          echo "previous=$old current=$new"
          if [ "$new" != "$old" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

  build-test:
    name: Lint, build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Compile (webpack bundle)
        run: npm run compile
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests (headless VS Code)
        run: xvfb-run -a npm run test:integration

  deploy:
    name: Publish to Marketplace
    needs: [build-test, version-check]
    if: needs.version-check.outputs.changed == 'true'
    # Cross-platform since #264: the plugin-profiler capture tool it used to build here was
    # net48 (Windows-only to compile) and is gone — capture is now Web API calls in the
    # extension itself. Everything left (webpack/vsce/the net8 typings tool) is portable.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - run: npm ci
      - name: Publish to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.VSCE_PAT }}
          registryUrl: https://marketplace.visualstudio.com
          # Channel switch. `false` ships a STABLE release to everyone; `true` ships to the
          # pre-release channel only. 1.0.0 (GA) is the first stable since 0.7.0 — flip this
          # back to `true` for the pre-release builds that follow it (each one still needs a
          # version higher than the last published one, stable or pre-release).
          preRelease: false
