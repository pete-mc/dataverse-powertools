on:
  push:
    branches:
      - main

name: Deploy Extension
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
permissions:
  contents: read
jobs:
  build-test:
    name: Lint, build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Compile (webpack bundle)
        run: npm run compile
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests (headless VS Code)
        run: xvfb-run -a npm run test:integration

  deploy:
    name: Publish to Marketplace
    needs: build-test
    # Windows runner: vscode:prepublish builds the net48 capture tool
    # (profiler-tool/ -> tools/pluginprofiler/) from source, which .NET Framework
    # can only compile on Windows. Everything else (webpack/vsce) is cross-platform.
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: npm ci
      - name: Publish to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.VSCE_PAT }}
          registryUrl: https://marketplace.visualstudio.com
          # Ship as PRE-RELEASE while the multi-component/panel wave stabilises;
          # users on release stay on 0.7.0 until a stable is published.
          preRelease: true
